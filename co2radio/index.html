<!DOCTYPE html>

        <style>

            :root {

            header {
                background-color: rgba(24, 41, 73, 0.3);

                display: flex;

                background-size: 10vw 10vw;
                font-family: "Zen Maru Gothic", sans-serif;
                font-size: large;
                color: #ffffff;
                margin: 0;
                }

            nav {
                position:absolute;
                right: 9vw;;
                display: flex;
                gap: clamp(32px,5vw,100px)
            }

            nav a {

            }

                width: 70%;
            }

            #latest {
                display: flex;
                justify-content: center;
                align-items: center;
                flex-direction: column;
                border-style: solid;
                border-width: 0px;
                margin: 5vw;
                border-radius: 7vw;
                background-color: rgba(24, 41, 73, 0.3);
                color: #ffffff;
                padding-bottom: 7vw;
                padding-top: 3vw;
                backdrop-filter: blur(8px);
            }

            #latest h2 {
                font-size: 8vw;
                text-align: center;
                color: white;
            }

            #latest p {
                font-size: 3.5vw;
            }

            #latest iframe {
                width: 80%;
                border-radius: 3vw;
                height: 20vh;
            }

    <body id="top">
            <header>
