<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF=8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>CO₂れいでぃお</title>
        <meta name="description" content="CO₂れいでぃお公式サイト">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
        <style>

            :root {
                font-size: medium;
            }

            header {
                background-color: rgba(24, 41, 73, 0.5);
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                padding: 3%;
                display: flex;
                align-items: center;
            }

            body {
                background-color: #051636;
                background-image:
                    linear-gradient(rgba(255, 255, 255, 0.05) 2px, transparent 2px),
                    linear-gradient(90deg, rgba(255, 255, 255, 0.05) 2px, transparent 2px);
                background-size: 10vw 10vw;
                font-family: "Zen Maru Gothic", sans-serif;
                font-size: large;
                color: #ffffff;
                margin: 0;
                }

            nav {
                position:absolute;
                right: 5vw;;
                display: flex;
                gap: clamp(32px,5vw,100px)
            }

            nav a {
                color: #ffffff;
                text-decoration: none;
                font-size: clamp(16px,4vw,64px);
            }

            main {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-direction: column;
                padding-top: 10%;
            }

            main h1 {
                font-size: clamp(40px,7vw,100px);
            }

            #icon {
                border-radius: 20%;
                width: 70%;
            }

        </style>
    </head>
    <body>
        <header>
            <img src="https://gekkori-11.github.io/co2radio/images/logo_website.png" alt="CO₂れいでぃお_logo" width="25%">
            <nav>
                <a href="#top">トップ</a>
                <a href="#about">番組について</a>
                <a href="#bosyu">各種募集</a>
            </nav> 
        </header>
        <main>
            <img src="https://gekkori-11.github.io/co2radio/images/icon.png" id="icon">
            <h1>CO₂れいでぃお</h1>
            <p>てすと</p>
        </main>
    </body>
</html>
